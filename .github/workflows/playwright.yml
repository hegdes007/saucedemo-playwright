name: Playwright Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playwright-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run Playwright tests
      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: true

      # Restore previous Allure history (if branch exists)
      - name: Restore Allure history
        if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p allure-history

          if git fetch origin refs/heads/allure-history:refs/remotes/origin/allure-history 2>/dev/null; then
            echo "Allure history branch found."

            if git show origin/allure-history:history.jsonl > allure-history/history.jsonl 2>/dev/null; then
              echo "Previous history restored."
            else
              echo "No previous history file found. Starting fresh."
            fi
          else
            echo "Allure history branch does not exist yet. Starting fresh."
          fi

      # Generate Allure 3 HTML report
      - name: Generate Allure report
        id: report
        if: always()
        run: npx allure generate allure-results

      # Save updated Allure history
      - name: Publish Allure history
        if: always() && steps.report.outcome == 'success' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: allure-history
          publish_dir: allure-history
          force_orphan: true

      # Publish Allure HTML report to GitHub Pages
      - name: Publish Allure report
        if: always() && steps.report.outcome == 'success' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true

      # Fail workflow if Playwright tests failed
      - name: Check test result
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
